<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’Écho de Bretagne — Journal libre et indépendant</title>

<style>
*{box-sizing:border-box}

:root{
--parchemin:#eee1c5;
--papier:#f6ecd5;
--ocre:#cbb88f;
--brun:#2d251c;
--brun2:#191510;
--bordeaux:#762c27;
--or:#a17a38;
--ligne:#927d5b
}

html{scroll-behavior:smooth}

body{
margin:0;
background:var(--ocre);
color:var(--brun);
font-family:Georgia,"Times New Roman",serif
}

header{
background:var(--parchemin);
text-align:center;
padding:28px 15px 20px;
border-bottom:7px double #806d50;
box-shadow:0 3px 12px rgba(0,0,0,.18)
}

.masthead-kicker{
font-size:12px;
letter-spacing:4px;
text-transform:uppercase;
color:#6f604c
}

header h1{
font-size:clamp(46px,9vw,88px);
line-height:.95;
margin:10px 0 12px;
letter-spacing:-2px
}

header p{
margin:0;
font-size:clamp(17px,3vw,24px);
font-style:italic;
color:#514433
}

.edition-date{
margin-top:14px;
font-size:14px;
color:#765f3f;
letter-spacing:1px
}

.ornement{
display:flex;
align-items:center;
gap:12px;
max-width:520px;
margin:14px auto 0;
color:var(--bordeaux)
}

.ornement:before,
.ornement:after{
content:"";
height:1px;
background:var(--ligne);
flex:1
}

nav{
background:var(--brun2);
text-align:center;
padding:14px 8px;
border-bottom:3px solid var(--or)
}

nav a{
display:inline-block;
margin:4px 10px;
color:#eadfc9;
text-decoration:none;
text-transform:uppercase;
font-size:13px;
font-weight:bold
}

nav a:hover{
color:#d5ad5b
}

main{
max-width:1150px;
margin:28px auto;
padding:0 15px
}

.paper,
.card,
.journal-card{
background:var(--papier);
border:1px solid var(--ligne);
box-shadow:0 7px 22px rgba(107,87,54,.28)
}

.paper{
padding:28px
}

.special-label,
.section-label{
color:var(--bordeaux);
letter-spacing:4px;
text-transform:uppercase;
font-size:13px;
font-weight:bold
}

.meta{
margin:0 0 8px;
color:#6f604c;
font-size:13px;
font-style:italic
}

.hero{
display:grid;
grid-template-columns:1fr 1.05fr;
gap:30px;
align-items:center
}

.hero-copy h2{
font-size:clamp(34px,5vw,62px);
line-height:1.02;
margin:12px 0 18px
}

.hero-copy .chapo{
font-size:18px;
line-height:1.75;
margin:0
}

.hero img{
width:100%;
display:block;
border:1px solid var(--ligne);
box-shadow:0 4px 14px rgba(0,0,0,.22)
}

.button{
display:inline-block;
margin-top:18px;
padding:12px 18px;
background:var(--bordeaux);
border:2px solid #51201c;
color:var(--papier);
text-decoration:none;
font-weight:bold
}

.button:hover{
background:#54201c
}

.section-heading{
text-align:center;
margin:45px 0 20px
}

.section-heading h2{
margin:8px 0;
font-size:clamp(30px,5vw,48px)
}

.section-heading p{
margin:0;
color:#6f604c;
font-style:italic
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px
}

.card{
padding:21px;
position:relative
}

.card:before{
content:"✦";
display:block;
margin-bottom:10px;
text-align:center;
color:var(--bordeaux)
}

.card h3{
font-size:24px;
line-height:1.2;
margin:9px 0 10px
}

.card p{
font-size:15px;
line-height:1.7
}

.card a{
color:var(--bordeaux);
font-weight:bold;
text-decoration:none
}

.card a:hover{
text-decoration:underline
}

/* JOURNAUX */

.journaux{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px
}

.journal-card{
padding:28px;
text-align:center
}

.journal-card .sigle{
font-size:12px;
letter-spacing:3px;
text-transform:uppercase;
color:#6f604c
}

.journal-card h3{
font-size:32px;
margin:12px 0;
color:var(--bordeaux)
}

.journal-card p{
max-width:480px;
margin:0 auto;
font-size:16px;
line-height:1.8
}

/* ARTICLE */

.article{
margin-top:42px
}

.article-head{
text-align:center;
border-bottom:1px solid var(--ligne);
padding-bottom:22px;
margin-bottom:24px
}

.article-head h2{
font-size:clamp(34px,6vw,58px);
line-height:1.05;
margin:10px 0
}

.article-head p{
margin:0;
color:#6f604c;
font-style:italic
}

.article-body p{
max-width:820px;
margin:0 auto 20px;
font-size:18px;
line-height:1.85
}

.phrase-forte{
max-width:760px!important;
margin:28px auto!important;
padding:18px 22px;
border-left:4px solid var(--bordeaux);
background:var(--parchemin);
font-size:20px!important;
font-style:italic
}

/* SECTIONS */

.info-section{
margin-top:42px
}

.info-section .paper p{
font-size:17px;
line-height:1.8
}

/* FOOTER */

footer{
text-align:center;
padding:35px 15px;
color:#5f513e
}

footer .ornement{
margin-bottom:18px
}

/* MOBILE */

@media(max-width:800px){

.hero{
grid-template-columns:1fr
}

.cards{
grid-template-columns:1fr
}

.journaux{
grid-template-columns:1fr
}

}

@media(max-width:600px){

header{
padding:24px 12px 18px
}

header h1{
font-size:48px;
letter-spacing:-1px
}

header p{
font-size:17px
}

nav{
padding:11px 5px
}

nav a{
margin:3px 5px;
font-size:
